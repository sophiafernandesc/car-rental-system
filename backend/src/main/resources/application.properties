spring.application.name=carrental

# Carrega variáveis do arquivo backend/.env (não versionado)
spring.config.import=optional:file:.env[.properties]

# Banco de dados - Supabase (PostgreSQL, Session pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# O plano gratuito do Supabase limita o número de conexões
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiracao-horas=8

# CORS (front-end Vite)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
